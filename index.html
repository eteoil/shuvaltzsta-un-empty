<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#b75252">
<title>シュバルツスタ -ʌ'n*empty-</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="css/console.css">
</head>
<body>
<main class="console" id="console">
  <section class="bezel">
    <div class="bezel-top"><span class="led" id="led"></span><span>INPUT</span></div>
    <canvas id="screen" width="480" height="320"></canvas>
  </section>

  <div class="dpad" role="group" aria-label="十字ボタン">
    <button type="button" class="pad up" data-btn="up" aria-label="上"></button>
    <button type="button" class="pad left" data-btn="left" aria-label="左"></button>
    <span class="pad hub" aria-hidden="true"></span>
    <button type="button" class="pad right" data-btn="right" aria-label="右"></button>
    <button type="button" class="pad down" data-btn="down" aria-label="下"></button>
    <kbd class="hint dpad-hint">矢印 / WASD</kbd>
  </div>

  <div class="ab" role="group" aria-label="AボタンとBボタン">
    <div class="ab-cell b"><button type="button" class="round" data-btn="b" aria-label="B">B</button><span>B</span><kbd class="hint">Z / J</kbd></div>
    <div class="ab-cell a"><button type="button" class="round" data-btn="a" aria-label="A">A</button><span>A</span><kbd class="hint">X / K</kbd></div>
  </div>

  <div class="sys" role="group" aria-label="システムボタン">
    <button type="button" class="sys-cell" data-btn="pause" aria-label="ポーズ"><span class="pill"></span><span>PAUSE</span><kbd class="hint">P</kbd></button>
    <button type="button" class="sys-cell" data-btn="start" aria-label="スタート"><span class="pill"></span><span>START</span><kbd class="hint">Enter</kbd></button>
  </div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
